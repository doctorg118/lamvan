<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Tra Định Dạng File</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
    </style>
</head>
<body>
    <h1>Tải lên File và Kiểm Tra Định Dạng</h1>
    <input type="file" id="fileInput" />
    <p id="fileType"></p>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileType = document.getElementById('fileType');

        fileInput.addEventListener('change', function() {
            const file = fileInput.files[0]; // Lấy file đầu tiên từ danh sách
            if (file) {
                const type = file.type; // Lấy loại file
                const name = file.name; // Lấy tên file
                fileType.textContent = `Tên file: ${name}, Định dạng file: ${type}`;
            } else {
                fileType.textContent = 'Không có file nào được chọn.';
            }
        });
    </script>
</body>
</html>
