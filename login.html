<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f3ed"><title>Đăng nhập quản trị | LAM VÂN</title><style>
:root{--ink:#25221f;--muted:#77716a;--cream:#f7f3ed;--paper:#fffdf9;--line:#e8e0d6;--accent:#9b7653;--dark:#765638}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#f7f3ed,#e7d9c8);font-family:Arial,Helvetica,sans-serif;color:var(--ink);display:grid;place-items:center;padding:22px}.login-card{width:min(440px,100%);background:var(--paper);padding:36px;border:1px solid var(--line);box-shadow:0 18px 55px #2a211414}.brand{text-align:center;font:700 29px Georgia,serif;letter-spacing:4px}.brand span{color:var(--accent)}.eyebrow{text-align:center;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--dark);margin-top:22px}h1{text-align:center;font:400 30px Georgia,serif;margin:8px 0}p.help{text-align:center;color:var(--muted);font-size:13px;margin:0 0 25px}.field{margin:16px 0}.field label{display:block;font-size:13px;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid var(--line);background:white;font:inherit}.btn{width:100%;padding:13px;border:1px solid var(--ink);background:var(--ink);color:white;font:inherit;cursor:pointer;margin-top:8px}.btn:disabled{opacity:.6;cursor:wait}.message{font-size:13px;padding:12px;background:#f4eadb;color:#6c4d2b;margin:14px 0;display:none}.message.show{display:block}.back{display:block;text-align:center;margin-top:22px;color:var(--muted);font-size:13px;text-decoration:none}.back:hover{color:var(--dark)}.tiny{text-align:center;color:var(--muted);font-size:11px;margin-top:18px}
</style></head><body><main class="login-card"><div class="brand">LAM<span>VÂN</span></div><div class="eyebrow">Store management</div><h1>Đăng nhập quản trị</h1><p class="help">Sử dụng email và mật khẩu tài khoản đã tạo trong Supabase Auth.</p><div id="message" class="message" role="alert"></div><form id="loginForm"><div class="field"><label for="email">Email quản trị</label><input id="email" type="email" autocomplete="username" required placeholder="admin@example.com"></div><div class="field"><label for="password">Mật khẩu</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Nhập mật khẩu"></div><button class="btn" type="submit" id="submitBtn">ĐĂNG NHẬP</button></form><a class="back" href="index.html">← Quay về cửa hàng</a><p class="tiny">Quyền quản trị được kiểm tra bằng bảng admin_users trong Supabase.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
'use strict';const cfg=window.LAMVAN_SUPABASE_CONFIG||{};const msg=document.getElementById('message'),form=document.getElementById('loginForm'),btn=document.getElementById('submitBtn');function show(text){msg.textContent=text;msg.classList.add('show')}if(!cfg.url||!cfg.anonKey||cfg.url.includes('YOUR_PROJECT')||cfg.anonKey.includes('YOUR_SUPABASE'))show('Chưa cấu hình Supabase. Hãy điền Project URL và anon/publishable key trong supabase-config.js.');const sb=cfg.url&&cfg.anonKey?window.supabase.createClient(cfg.url,cfg.anonKey):null;const params=new URLSearchParams(location.search);if(params.get('reason')==='not-admin')show('Tài khoản đã đăng nhập nhưng chưa được cấp quyền quản trị. Hãy thêm UUID của tài khoản vào bảng admin_users.');form.addEventListener('submit',async e=>{e.preventDefault();if(!sb)return show('Chưa cấu hình Supabase.');btn.disabled=true;btn.textContent='ĐANG ĐĂNG NHẬP…';msg.classList.remove('show');try{const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;const {data:admin,error:adminError}=await sb.from('admin_users').select('user_id').eq('user_id',data.user.id).maybeSingle();if(adminError||!admin){await sb.auth.signOut();throw new Error('Đăng nhập được nhưng tài khoản chưa có quyền quản trị. Hãy thêm UUID trong bảng admin_users.')}location.href='admin.html'}catch(err){show(err.message||'Không đăng nhập được. Vui lòng kiểm tra email và mật khẩu.')}finally{btn.disabled=false;btn.textContent='ĐĂNG NHẬP'}});
</script></body></html>
